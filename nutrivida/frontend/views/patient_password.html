<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir Senha - NutriVida</title>
    
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/meal.css"> 
    <link rel="stylesheet" href="../css/patientDetails.css">
    <link rel="stylesheet" href="../css/password.css">
</head>
<body>

    <nav class="navbar">
        <h2>NutriVida | Segurança</h2>
        <div class="nav-right-container">
            <a href="patient_dashboard.html" class="nav-link-profile">Início</a>
            <a href="patient_addresses.html" class="nav-link-profile">Meus Endereços</a>
            <a href="patient_details.html" class="nav-link-profile">Meu Perfil</a>
            <a href="patient_password.html" class="nav-link-profile nav-active">Redefinir Senha</a>
            
            <span id="headerName">Carregando...</span>
            <button class="btn-logout" id="btnLogout">Sair</button>
        </div>
    </nav>

    <div class="details-page-container">
        
        <div class="meal-form profile-card">
            
            <div class="meal-header">
                <h3>Alterar Senha de Acesso</h3>
            </div>
            <hr class="section-divider">

            <form id="password-form">
                
                <div class="form-group">
                    <label for="current-password">Senha Atual:</label>
                    <input type="password" id="current-password" class="form-control" placeholder="Digite sua senha atual" required>
                </div>

                <div class="form-group">
                    <label for="new-password">Nova Senha:</label>
                    <input type="password" id="new-password" class="form-control" placeholder="Digite a nova senha" required>
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirmar Nova Senha:</label>
                    <input type="password" id="confirm-password" class="form-control" placeholder="Repita a nova senha" required>
                    <div id="password-match-error" class="password-feedback feedback-error">As senhas não coincidem.</div>
                </div>

                <div class="save-area">
                    <button type="submit" class="btn-save-meal">Salvar Nova Senha</button>
                </div>

            </form>
        </div>
    </div>

    <script src="../js/password.js"></script>
</body>
</html>
